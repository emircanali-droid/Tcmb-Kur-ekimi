name: TCMB Kurlarini Google Sheets'e Isle

on:
  schedule:
    # Pazartesi - Cuma: TSİ 15:40 (UTC 12:40)
    - cron: '40 12 * * 1-5'
  workflow_dispatch:

jobs:
  sync_sheets:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: |
          pip install -r requirements.txt

      - name: Kurlari Cek ve Sheets'e Yaz
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python sheets_tracker.py
